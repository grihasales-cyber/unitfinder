name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            # Copy-paste can add spaces or line breaks; keep only base64 characters.
            printf '%s' "$KS_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/uf.jks" \
              || { echo "::error::ANDROID_KEYSTORE_B64 is not the text of keystore-base64.txt. Paste the whole file content again."; exit 1; }
            KS_PW=$(printf '%s' "$KS_PW" | tr -d ' \r\n\t')
            keytool -list -keystore "$RUNNER_TEMP/uf.jks" -storepass "$KS_PW" > /dev/null \
              || { echo "::error::The key and ANDROID_KEYSTORE_PASSWORD do not match. Paste password.txt again."; exit 1; }
            echo "::add-mask::$KS_PW"
            echo "UF_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            # No team key yet: sign with a throwaway key so the test build still installs. It is not published.
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/uf.jks" -alias unitfinder -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Unit Finder test"
            echo "::add-mask::$PW"
            echo "UF_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi
          echo "UF_KEYSTORE=$RUNNER_TEMP/uf.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          UF_VERSION_CODE: ${{ github.run_number }}
          UF_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk unitfinder.apk
          keytool -printcert -jarfile unitfinder.apk | grep -i 'SHA256:' | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: unitfinder-apk
          path: unitfinder.apk

      - name: Publish for the team
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app unitfinder.apk --title "Unit Finder app 1.0.${{ github.run_number }}" \
            --notes "Install on Android: download unitfinder.apk and open it. The app always shows the latest website, so updates do not need a new APK." \
            --target "${{ github.sha }}"
